[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]  # Alembic's template imports after config setup

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
